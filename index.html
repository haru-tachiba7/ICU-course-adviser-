<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>履修台帳 — Information Science</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFEAE0;
    --panel: #E4DDCE;
    --panel-2: #DAD2BE;
    --ink: #1E2A33;
    --ink-muted: #5C6B73;
    --gold: #8C6A1E;
    --rust: #9C4530;
    --border: #C9BFA9;
    --serif: 'Lora', Georgia, 'Noto Serif JP', serif;
    --sans: 'Inter', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10191F;
      --panel: #16222A;
      --panel-2: #1C2A33;
      --ink: #EDE6D6;
      --ink-muted: #8A97A0;
      --gold: #C9A227;
      --rust: #C1614A;
      --border: #2A3944;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10191F;
    --panel: #16222A;
    --panel-2: #1C2A33;
    --ink: #EDE6D6;
    --ink-muted: #8A97A0;
    --gold: #C9A227;
    --rust: #C1614A;
    --border: #2A3944;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
  }
  a { color: inherit; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 32px;
  }
  header.top h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
  }
  header.top .sub {
    color: var(--ink-muted);
    font-size: 13.5px;
  }
  .major-select {
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink-muted);
  }
  .major-select select {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
    margin-left: 8px;
  }
  .major-select select + select,
  .major-select select ~ select { margin-left: 8px; }
  #elaStreamSelect { margin-left: 8px; }
  .tutorial-open-btn {
    margin-left: 14px;
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink-muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .tutorial-open-btn:hover { color: var(--gold); border-color: var(--gold); }

  /* ---- チュートリアル(初回案内) ---- */
  /* ハイライト枠自身のbox-shadowを画面全体に広げることで、枠の外側だけが暗くなる
     「スポットライト」効果を作る(枠の中は透明なので、対象要素がそのまま明るく見える)。 */
  .tutorial-highlight {
    position: fixed;
    border: 2px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 0 0 4000px rgba(16,25,31,0.55);
    z-index: 51;
    pointer-events: none;
    transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
  }
  :root:not([data-theme="dark"]) .tutorial-highlight { box-shadow: 0 0 0 4000px rgba(30,42,51,0.45); }
  .tutorial-card {
    position: fixed;
    z-index: 52;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .tutorial-progress {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .tutorial-card h3 {
    font-family: var(--serif);
    font-size: 16px;
    margin: 0 0 8px;
  }
  .tutorial-card p {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0;
  }
  .tutorial-actions {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 32px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---- Ledger (category progress) ---- */
  .ledger h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }
  .cat-row {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .cat-row:first-of-type { border-top: 1px solid var(--border); }
  .cat-name {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 7px;
  }
  .cat-name .n { font-weight: 500; }
  .cat-name .nums { font-family: var(--mono); font-size: 12.5px; color: var(--ink-muted); }
  .cat-name .nums b { color: var(--ink); font-weight: 500; }
  .req-edit {
    cursor: pointer;
    border-bottom: 1px dotted var(--ink-muted);
  }
  .req-edit:hover { color: var(--gold); border-color: var(--gold); }
  .bar-track {
    position: relative;
    height: 6px;
    background: var(--panel-2);
    border-radius: 0;
    overflow: hidden;
  }
  .bar-earned { position: absolute; left: 0; top: 0; height: 100%; background: var(--gold); }
  .bar-planned { position: absolute; top: 0; height: 100%; background: var(--gold); opacity: 0.35; }
  .cat-row.over .bar-earned { background: var(--rust); }

  .ledger-total {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .ledger-total { background: var(--panel); padding: 14px 12px; }
  .ledger-total .label { font-family: var(--serif); font-size: 20px; font-weight: 600; }
  .ledger-total .value { font-family: var(--mono); font-size: 15px; }
  .ledger-total .value b { font-size: 19px; }

  .ledger-note {
    margin-top: 20px;
    font-size: 12px;
    color: var(--ink-muted);
    border-left: 2px solid var(--border);
    padding-left: 10px;
  }
  .cap-rules {
    margin-top: 16px;
    font-size: 12px;
  }
  .cap-rules .rule {
    padding: 7px 0;
    border-top: 1px solid var(--border);
    color: var(--ink-muted);
  }
  .cap-rules .rule.warn { color: var(--rust); }
  .cap-rules .rule b { color: var(--ink); font-weight: 500; }

  /* ---- Course browser ---- */
  .browser h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 14px;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 7px 10px;
  }
  .controls input[type="search"] { flex: 1; min-width: 180px; }

  table.courses {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.courses thead th {
    text-align: left;
    font-weight: 500;
    color: var(--ink-muted);
    font-size: 11.5px;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--ink);
  }
  table.courses tbody td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.courses tbody tr:hover { background: var(--panel); }
  .cno { font-family: var(--mono); font-size: 12.5px; }
  .cat-tag {
    font-size: 11px;
    color: var(--ink-muted);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1px 5px;
    display: inline-block;
  }
  .add-btn {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--gold);
    background: none;
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .add-btn:hover { background: var(--gold); color: var(--bg); }
  .more-note { text-align: center; color: var(--ink-muted); font-size: 12.5px; padding: 14px 0; }

  .title-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    border-bottom: 1px dotted var(--ink-muted);
  }
  .title-btn:hover { color: var(--gold); border-color: var(--gold); }
  .e-detail { background: var(--panel); padding: 12px 10px 14px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--gold); }
  .detail-row td {
    background: var(--panel);
    padding: 12px 10px 14px;
    font-size: 12.5px;
  }
  .detail-desc {
    margin: 0 0 10px;
    line-height: 1.6;
  }
  .detail-desc.empty { color: var(--ink-muted); font-style: italic; }
  .offering-list { display: flex; flex-direction: column; gap: 4px; }
  .offering-list div {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--ink-muted);
  }
  .offering-list a { color: var(--gold); white-space: nowrap; }

  /* ---- Enrollment panel ---- */
  .enrolled {
    margin-top: 40px;
  }
  .enrolled h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 14px;
  }
  .erow {
    display: grid;
    grid-template-columns: 84px 1fr 130px 218px 44px 28px;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .erow.head {
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--ink);
  }
  .erow select, .erow input {
    font-family: var(--sans);
    font-size: 12.5px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 6px;
    width: 100%;
  }
  .erow .rm {
    background: none;
    border: none;
    color: var(--rust);
    cursor: pointer;
    font-size: 15px;
  }
  .empty-note {
    color: var(--ink-muted);
    font-size: 13.5px;
    padding: 20px 0;
    border: 1px dashed var(--border);
    text-align: center;
  }

  /* ---- 追加時の状態(セグメント) ---- */
  .add-mode {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .add-mode-label { font-size: 12.5px; color: var(--ink-muted); }
  .add-mode-hint { font-size: 12px; color: var(--ink-muted); }
  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .seg button {
    font-family: var(--sans);
    font-size: 13px;
    background: var(--bg);
    color: var(--ink-muted);
    border: 0;
    padding: 6px 14px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--gold); color: var(--bg); }

  /* ---- 履修リストの状態チップ ---- */
  .chips { display: inline-flex; gap: 4px; }
  .chip {
    font-family: var(--sans);
    font-size: 12px;
    background: none;
    color: var(--ink-muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--gold); color: var(--ink); }
  .chip.on { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .e-title { min-width: 0; }

  @media (max-width: 760px) {
    .erow.head { display: none; }
    .erow { display: flex; flex-wrap: wrap; gap: 8px 10px; }
    .erow > .cno { order: 1; }
    .erow > .rm { order: 1; margin-left: auto; }
    .erow > .e-title { order: 2; flex: 1 1 100%; }
    .erow > .e-cat { order: 3; flex: 1 1 130px; width: auto; }
    .erow > .e-status-cell { order: 4; }
    .erow > .e-credit { order: 5; }
  }

  /* ---- トースト(取り消し) ---- */
  .toast {
    display: none;
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    align-items: center;
    gap: 14px;
    max-width: 92vw;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--bg);
    font-size: 13.5px;
    border-radius: 3px;
    z-index: 20;
  }
  .toast.show { display: flex; }
  .toast button {
    font-family: var(--sans);
    font-size: 13px;
    background: none;
    border: 1px solid currentColor;
    color: inherit;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
</style>
<script src="sync.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px"><h1 style="margin:0">履修台帳</h1><a class="tutorial-open-btn" style="margin:0;text-decoration:none;background:var(--gold);border-color:var(--gold);color:var(--bg)">卒業要件</a><a href="timetable.html" class="tutorial-open-btn" style="margin:0;text-decoration:none">時間割</a></div>
      <div class="sub">4年間の単位をメジャーの卒業要件に照らして確認する</div>
    </div>
    <div class="major-select">
      履修形態
      <select id="modeSelect"></select>
      <span style="margin-left:14px">メジャー<span id="primaryLabelSuffix"></span></span>
      <select id="majorSelect"></select>
      <span id="secondaryWrap" style="margin-left:14px; display:none">
        <span id="secondaryLabel"></span>
        <select id="secondarySelect"></select>
      </span>
      <span style="margin-left:14px">語学トラック</span>
      <select id="elaStreamSelect"></select>
      <button type="button" id="tutorialBtn" class="tutorial-open-btn">使い方</button>
    </div>
  </header>

  <div class="layout">
    <div class="ledger">
      <h2>卒業要件の充足状況</h2>
      <div id="catRows"></div>
      <div class="ledger-total">
        <span class="label">総計</span>
        <span class="value" id="totalValue"></span>
      </div>
      <div class="ledger-note">
        ゴールドの濃い部分は「履修済」、薄い部分は「計画中(履修中・確定・予定など)」の単位。必要単位の数字はクリックすると変更できます(ストリームや配属によって変わる場合はここで調整してください)。
      </div>
      <div class="cap-rules" id="capRules"></div>
    </div>

    <div class="main">
      <div class="browser">
        <h2>科目を探す</h2>
        <div class="add-mode">
          <span class="add-mode-label">追加時の状態</span>
          <div class="seg" id="addStatusSeg"></div>
          <span class="add-mode-hint">「追加」を押すと、この状態ですぐ履修リストに入ります</span>
        </div>
        <div class="controls">
          <input type="search" id="searchBox" placeholder="科目番号または科目タイトルで検索(例: ISC, 微積分)">
          <select id="catFilter">
            <option value="">すべての区分</option>
          </select>
          <select id="prefixFilter">
            <option value="">すべてのメジャー(科目群)</option>
          </select>
        </div>
        <table class="courses">
          <thead>
            <tr>
              <th style="width:90px">科目番号</th>
              <th>科目タイトル</th>
              <th style="width:60px" class="sortable" data-sort="credit">単位<span class="sort-ind"></span></th>
              <th style="width:110px" class="sortable" data-sort="term">開講学期<span class="sort-ind"></span></th>
              <th style="width:90px">区分</th>
              <th style="width:96px"></th>
            </tr>
          </thead>
          <tbody id="courseBody"></tbody>
        </table>
        <div class="more-note" id="moreNote"></div>
      </div>

      <div class="enrolled">
        <h2>履修リスト(あなたのデータ)</h2>
        <div id="enrolledArea"></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap" style="padding:0 24px 70px"><div id="fb" style="border-top:1px solid var(--border);padding-top:16px;font-size:13px;color:var(--ink-muted)">ご意見、ご要望があればお伝えください。 <a href="https://forms.gle/LjdwNjKYja3AGZjVA" target="_blank" rel="noopener" style="color:var(--gold)">意見フォームはこちら ↗</a></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="cap_rules.js"></script>
<script src="majors.js"></script>
<script>
const STORAGE_KEY = 'icu_planner_enrollments_v1';
const OVERRIDE_KEY = 'icu_planner_category_overrides_v1';
const MAJOR_KEY = 'icu_planner_major_v1';
const ELA_STREAM_KEY = 'icu_planner_ela_stream_v1';

function loadOverrides() {
  try {
    const raw = localStorage.getItem(OVERRIDE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveOverrides(o) {
  try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(o)); } catch (e) {}
}
let categoryOverrides = loadOverrides();
function requiredFor(cat) {
  const v = categoryOverrides[cat.id];
  return (v === undefined || v === null || v === '') ? cat.required_credits : Number(v);
}
function setOverride(id, val, defaultVal) {
  if (val === null || val === undefined || val === '' || Number(val) === Number(defaultVal)) {
    delete categoryOverrides[id];
  } else {
    categoryOverrides[id] = Number(val);
  }
}

function loadEnrollments() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEnrollments(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}
let enrollments = loadEnrollments();

function loadMajor() {
  try { return localStorage.getItem(MAJOR_KEY) || 'ISC'; } catch (e) { return 'ISC'; }
}
function saveMajor(prefix) {
  try { localStorage.setItem(MAJOR_KEY, prefix); } catch (e) {}
}
function loadElaStream() {
  try { return localStorage.getItem(ELA_STREAM_KEY) || ''; } catch (e) { return ''; }
}
function saveElaStream(id) {
  try { localStorage.setItem(ELA_STREAM_KEY, id); } catch (e) {}
}
let currentMajor = loadMajor();
let currentElaStream = loadElaStream();

// 履修形態: 'single'(メジャーのみ) / 'double'(ダブルメジャー) / 'minor'(メジャー・マイナー)
const MODE_KEY = 'icu_planner_mode_v1';
const SECONDARY_KEY = 'icu_planner_secondary_major_v1';
function loadMode() {
  try {
    const v = localStorage.getItem(MODE_KEY);
    return ['single', 'double', 'minor'].includes(v) ? v : 'single';
  } catch (e) { return 'single'; }
}
function saveMode(v) {
  try { localStorage.setItem(MODE_KEY, v); } catch (e) {}
}
function loadSecondary() {
  try { return localStorage.getItem(SECONDARY_KEY) || ''; } catch (e) { return ''; }
}
function saveSecondary(prefix) {
  try { localStorage.setItem(SECONDARY_KEY, prefix); } catch (e) {}
}
let currentMode = loadMode();
let currentSecondary = loadSecondary();

// 追加時の状態(科目一覧の「追加」を押したときに入る状態)。選んだ状態は次回も引き継ぐ。
const ADD_STATUS_KEY = 'icu_planner_add_status_v1';
const STATUS_MAIN = ['履修済', '履修中', '予定', '検討中'];
const STATUS_ALL = ['履修済', '履修中', '予定', '検討中', '仮予定', '確定', '取りやめ'];
function loadAddStatus() {
  try {
    const v = localStorage.getItem(ADD_STATUS_KEY);
    return STATUS_MAIN.includes(v) ? v : '履修済';
  } catch (e) { return '履修済'; }
}
function saveAddStatus(v) {
  try { localStorage.setItem(ADD_STATUS_KEY, v); } catch (e) {}
}
let addStatus = loadAddStatus();
let sortKey = '', sortDir = 1; // 科目一覧の並べ替え(単位・開講学期)
const TERM_ORDER = { '春': 0, '秋': 1, '冬': 2 };
let expandedEnr = null; // 履修リストで詳細を開いている科目
let expandedCno = null; // 科目タイトルをクリックして詳細を開いている科目(1件のみ)

const majorByPrefix = Object.fromEntries((typeof MAJORS !== 'undefined' ? MAJORS : []).map(m => [m.prefix, m]));
const courseByNo = Object.fromEntries(COURSES.map(c => [c.course_no, c]));

// 卒業要件の区分一覧は、履修形態(メジャーのみ/ダブルメジャー/メジャー・マイナー)によって
// 項目構成が変わる(専攻科目が1本か2本かなど)。data.js の CATEGORIES は「メジャーのみ」の
// 規定値として使い、実際にアプリが使う区分一覧は毎回ここで組み立て直す。
function buildCategoriesForMode(mode) {
  const base = [
    { id: 'ela', name: '英語(ELA)', required_credits: 0 },
    { id: 'jlp', name: '日本語(JLP)', required_credits: 22 },
    { id: 'ge', name: '一般教育', required_credits: 18 },
    { id: 'hpe', name: '保健体育', required_credits: 2 },
    { id: 'foundation', name: '基礎科目', required_credits: 18 },
  ];
  if (mode === 'double') {
    return base.concat([
      { id: 'major', name: '専攻科目(メジャー1)', required_credits: 21 },
      { id: 'major2', name: '専攻科目(メジャー2)', required_credits: 30 },
      { id: 'thesis', name: '卒業研究', required_credits: 9 },
      { id: 'elective', name: '選択科目', required_credits: 26 },
    ]);
  }
  if (mode === 'minor') {
    return base.concat([
      { id: 'major', name: '専攻科目(メジャー)', required_credits: 21 },
      { id: 'minor', name: '専攻科目(マイナー)', required_credits: 15 },
      { id: 'thesis', name: '卒業研究', required_credits: 9 },
      { id: 'elective', name: '選択科目', required_credits: 41 },
    ]);
  }
  return base.concat([
    { id: 'major', name: '専攻科目', required_credits: 21 },
    { id: 'thesis', name: '卒業研究', required_credits: 9 },
    { id: 'elective', name: '選択科目', required_credits: 40 },
  ]);
}

let ACTIVE_CATEGORIES = [];
let catById = {};
let catByName = {};
function rebuildCategories() {
  ACTIVE_CATEGORIES = buildCategoriesForMode(currentMode);
  catById = Object.fromEntries(ACTIVE_CATEGORIES.map(c => [c.id, c]));
  catByName = Object.fromEntries(ACTIVE_CATEGORIES.map(c => [c.name, c]));
}
rebuildCategories();

// ELAトラックではJLP、JLPトラックではELAの区分を隠す(未選択のときは両方表示)
function hiddenCat(id) {
  const t = String(currentElaStream || '');
  if (id === 'jlp') return t.startsWith('stream');
  if (id === 'ela') return t.startsWith('jlp_');
  return false;
}

// 語学トラック(ELAストリーム or JLP配置レベル)を探す
function findLanguageTrack(id) {
  const all = (typeof ELA_STREAMS !== 'undefined' ? ELA_STREAMS : [])
    .concat(typeof JLP_LEVELS !== 'undefined' ? JLP_LEVELS : []);
  return all.find(s => s.id === id);
}

// 語学トラック選択時(または履修形態の変更時)に、英語(ELA)・日本語(JLP)・一般教育・
// 選択科目の必要単位を公式資料の数値に合わせて自動設定する。
// 手動で数字をクリックして編集した場合も同じ仕組み(categoryOverrides)を使うため、動作は共通。
function applyStreamOverride() {
  const t = findLanguageTrack(currentElaStream);
  if (!t) return;
  const set = (id, val) => setOverride(id, val, catById[id] ? catById[id].required_credits : 0);
  set('ela', t.ela_credits || 0);
  set('jlp', t.jlp_credits || 0);
  set('ge', t.ge_credits != null ? t.ge_credits : 18);
  set('elective', t.elective_credits[currentMode]);
  saveOverrides(categoryOverrides);
}

// 単位の表記ゆれを数値にする。
//  "3"      -> 3
//  "(6)"    -> 6   (ELAなど、括弧付きは複数学期にまたがる科目の合計単位)
//  "3/(9)"  -> 9   (卒業研究: 1学期3単位 x 3学期、合計9単位)
//  "1/3"    -> 1/3 (PEエクササイズ: 3科目で1単位)
function parseCredit(raw) {
  const s = String(raw == null ? '' : raw).trim();
  const paren = s.match(/\((\d+(?:\.\d+)?)\)/);
  if (paren) return parseFloat(paren[1]);
  const frac = s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (frac) return Number(frac[1]) / Number(frac[2]);
  const n = parseFloat(s.replace(/[^\d.]/g, ''));
  return isNaN(n) ? 0 : n;
}
// 合計表示用: 0.333...を3つ足して0.9999...になるような誤差を丸める
function fmtNum(n) {
  const a = Math.round(n * 3);
  if (Math.abs(n * 3 - a) > 1e-6) return String(Math.round(n * 100) / 100);
  const w = Math.floor(a / 3), r = a % 3;
  return r ? (w ? w + '+' + r + '/3' : r + '/3') : String(w);
}
// 科目一覧などでの単位の表示用
function displayCredit(raw) {
  const s = String(raw == null ? '' : raw).trim();
  if (/^\d+\s*\/\s*\d+$/.test(s)) return s;   // 1/3 はそのまま
  return fmtNum(parseCredit(s));
}

function fmtTerms(offerings) {
  const terms = [...new Set(offerings.map(o => o.term))];
  return terms.join('/');
}

// 科目の卒業要件区分は、選択中の履修形態・メジャー(・第二メジャー/マイナー)によって変わる。
function courseCategory(c) {
  if (c.fixed_category) return c.fixed_category;
  if (c.level == null) return null;
  if (c.prefix === currentMajor) {
    return c.level === 1 ? catById['foundation'].name : catById['major'].name;
  }
  if (currentMode !== 'single' && c.prefix === currentSecondary) {
    const id = currentMode === 'double' ? 'major2' : 'minor';
    return c.level === 1 ? catById['foundation'].name : catById[id].name;
  }
  return c.level === 1 ? catById['foundation'].name : catById['elective'].name;
}

const MODE_LABELS = { single: 'メジャーのみ', double: 'ダブルメジャー', minor: 'メジャー・マイナー' };

}

}

// 基礎科目の「特定メジャーから最低n単位」を計算して1行分のHTMLを作る(履修形態によって複数回使う)
function minWithinRow(categoryId, prefix, minCredits, label) {
  const got = enrollments
    .filter(e => e.status !== '取りやめ' && e.category_id === categoryId && e.course_no.startsWith(prefix))
    .reduce((sum, e) => sum + parseCredit(e.credit), 0);
  const short = got < minCredits;
  return `<div class="rule${short ? ' warn' : ''}">${label}<br><b>${fmtNum(got)}</b> / ${minCredits} 単位</div>`;
}

function renderCapRules() {
  const el = document.getElementById('capRules');
  if (typeof CAP_RULES === 'undefined' || !el) return;
  let html = '';

  // 一般教育・保健体育: 必修超過分のうち選択科目に算入できる単位数(履修形態によらず共通)
  CAP_RULES.forEach(rule => {
    const cat = catById[rule.category_id];
    if (!cat) return;
    const req = requiredFor(cat);
    const assigned = enrollments
      .filter(e => e.status !== '取りやめ' && e.category_id === rule.category_id)
      .reduce((sum, e) => sum + parseCredit(e.credit), 0);
    const surplus = Math.max(0, assigned - req);
    const creditable = Math.min(surplus, rule.max_credits);
    const overCap = Math.max(0, surplus - rule.max_credits);
    let extra = `<br><b>${fmtNum(creditable)}</b> / ${rule.max_credits} 単位(選択科目に算入できる余剰分)`;
    if (overCap > 0) {
      extra += `<br><span style="color:var(--rust)">うち ${fmtNum(overCap)} 単位は上限を超えており、卒業要件として数えられません</span>`;
    }
    html += `<div class="rule">${rule.description}${extra}</div>`;
  });

  // 基礎科目の最低6単位ルール・専攻科目(メジャー2)の300番台最低3単位ルール
  // (履修形態によって本数・対象メジャーが変わる)
  const primaryName = majorByPrefix[currentMajor] ? majorByPrefix[currentMajor].name : currentMajor;
  const secondaryName = majorByPrefix[currentSecondary] ? majorByPrefix[currentSecondary].name : currentSecondary;
  if (currentMode === 'single') {
    html += minWithinRow('foundation', currentMajor, 6,
      `基礎科目18単位のうち、メジャー(${primaryName})の基礎科目から最低6単位を含める必要がある`);
  } else if (currentMode === 'double') {
    html += minWithinRow('foundation', currentMajor, 6,
      `基礎科目18単位のうち、メジャー1(${primaryName})の基礎科目から最低6単位を含める必要がある`);
    html += minWithinRow('foundation', currentSecondary, 6,
      `基礎科目18単位のうち、メジャー2(${secondaryName})の基礎科目から最低6単位を含める必要がある`);
    const l300 = enrollments
      .filter(e => e.status !== '取りやめ' && e.category_id === 'major2' && courseByNo[e.course_no] && courseByNo[e.course_no].level >= 3)
      .reduce((sum, e) => sum + parseCredit(e.credit), 0);
    const short300 = l300 < 3;
    html += `<div class="rule${short300 ? ' warn' : ''}">専攻科目(メジャー2)30単位のうち、300番台科目を最低3単位含める必要がある<br><b>${fmtNum(l300)}</b> / 3 単位</div>`;
  } else if (currentMode === 'minor') {
    html += minWithinRow('foundation', currentMajor, 6,
      `基礎科目18単位のうち、メジャー(${primaryName})の基礎科目から最低6単位を含める必要がある`);
    html += minWithinRow('foundation', currentSecondary, 6,
      `基礎科目18単位のうち、マイナー(${secondaryName})の基礎科目から最低6単位を含める必要がある`);
  }

  el.innerHTML = html;
}

function renderLedger() {
  const earned = {}, planned = {};
  ACTIVE_CATEGORIES.forEach(c => { earned[c.id] = 0; planned[c.id] = 0; });
  enrollments.forEach(e => {
    if (!catById[e.category_id]) return;
    if (e.status === '取りやめ') return;
    const credit = parseCredit(e.credit);
    if (e.status === '履修済') earned[e.category_id] += credit;
    else planned[e.category_id] += credit;
  });

  const rows = document.getElementById('catRows');
  rows.innerHTML = '';
  let totalReq = 0, totalDone = 0, totalPlan = 0;
  ACTIVE_CATEGORIES.forEach(c => {
    if (hiddenCat(c.id)) return;
    const req = requiredFor(c);
    totalReq += req;
    const e = earned[c.id], p = planned[c.id];
    totalDone += e; totalPlan += p;
    const safeReq = req > 0 ? req : 1;
    const pctE = Math.min(100, (e / safeReq) * 100);
    const pctP = Math.min(100 - pctE, (p / safeReq) * 100);
    const remaining = Math.max(0, req - e - p);
    const over = (e + p) > req;
    const isOverridden = categoryOverrides[c.id] !== undefined && categoryOverrides[c.id] !== null && categoryOverrides[c.id] !== '' && Number(categoryOverrides[c.id]) !== c.required_credits;
    const row = document.createElement('div');
    row.className = 'cat-row' + (over ? ' over' : '');
    row.innerHTML = `
      <div class="cat-name">
        <span class="n">${c.name}</span>
        <span class="nums"><b>${fmtNum(e + p)}</b> / <span class="req-edit" data-id="${c.id}" title="クリックして必要単位を変更(規定 ${c.required_credits})">${req}</span> 単位${isOverridden ? ' <span style="opacity:.6">(規定'+c.required_credits+')</span>' : ''}<br>残り ${fmtNum(remaining)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-earned" style="width:${pctE}%"></div>
        <div class="bar-planned" style="left:${pctE}%; width:${pctP}%"></div>
      </div>`;
    rows.appendChild(row);
  });
  document.getElementById('totalValue').innerHTML = `<div style="text-align:right"><div style="font-size:15px;font-weight:600">取得済 <b style="font-size:30px;color:var(--gold)">${fmtNum(totalDone)}</b> / ${totalReq} 単位</div><div style="font-size:15px;font-weight:600;margin-top:2px">取得予定 <b style="font-size:24px">${fmtNum(totalPlan)}</b> 単位</div><div style="font-size:13px;color:var(--ink-muted);margin-top:2px">(履修中・予定など) 合計 ${fmtNum(totalDone + totalPlan)} / ${totalReq}</div></div>`;
  renderCapRules();

  rows.querySelectorAll('.req-edit').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const cat = catById[id];
      const current = requiredFor(cat);
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.value = current;
      input.style.width = '48px';
      input.style.fontFamily = 'var(--mono)';
      input.style.fontSize = '12.5px';
      el.replaceWith(input);
      input.focus();
      input.select();
      const commit = () => {
        setOverride(id, input.value, cat.required_credits);
        saveOverrides(categoryOverrides);
        renderLedger();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); });
    });
  });
}

function renderCourseTable() {
  const q = document.getElementById('searchBox').value.trim().toUpperCase();
  const catFilter = document.getElementById('catFilter').value;
  const prefixFilter = document.getElementById('prefixFilter').value;
  const body = document.getElementById('courseBody');
  body.innerHTML = '';

  const addedCnos = new Set(enrollments.map(e => e.course_no));
  let filtered = COURSES.filter(c => {
    if (addedCnos.has(c.course_no)) return false;
    if (q && !(c.course_no.toUpperCase().includes(q) || c.title_ja.includes(q))) return false;
    if (prefixFilter && c.prefix !== prefixFilter) return false;
    const cat = courseCategory(c);
    if (catFilter === '__unclassified__' && cat) return false;
    if (catFilter && catFilter !== '__unclassified__' && cat !== catFilter) return false;
    return true;
  });

  if (sortKey) {
    const key = c => sortKey === 'credit'
      ? parseCredit(c.credit)
      : Math.min(...c.offerings.map(o => TERM_ORDER[o.term] ?? 9));
    filtered = filtered.slice().sort((a, b) => (key(a) - key(b)) * sortDir || a.course_no.localeCompare(b.course_no));
  }
  document.querySelectorAll('th.sortable').forEach(th => {
    th.querySelector('.sort-ind').textContent = th.dataset.sort === sortKey ? (sortDir > 0 ? ' ▲' : ' ▼') : '';
  });

  const LIMIT = 80;
  const shown = filtered.slice(0, LIMIT);
  shown.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="cno">${c.course_no}</td>
      <td><button type="button" class="title-btn" data-cno="${c.course_no}">${c.title_ja}</button></td>
      <td>${displayCredit(c.credit)}</td>
      <td>${fmtTerms(c.offerings)}</td>
      <td><span class="cat-tag">${courseCategory(c) || '未分類'}</span></td>
      <td><button class="add-btn" data-cno="${c.course_no}">＋ ${addStatus}</button></td>
    `;
    body.appendChild(tr);
    if (c.course_no === expandedCno) {
      body.appendChild(buildDetailRow(c));
    }
  });

  const note = document.getElementById('moreNote');
  note.textContent = filtered.length > LIMIT
    ? `他 ${filtered.length - LIMIT} 件。検索や区分で絞り込んでください。`
    : (filtered.length === 0 ? '該当する科目が見つかりません。' : '');
}

// 科目タイトルをクリックしたときに開く詳細行(概要 + 開講情報 + 公式シラバスへのリンク)
function detailInner(c) {
  const descHtml = c.desc
    ? `<p class="detail-desc">${c.desc}</p>`
    : `<p class="detail-desc empty">概要はまだ取得できていません。公式シラバスのリンクから確認してください。</p>`;
  const offeringsHtml = c.offerings.map(o => `
    <div>
      <span>${o.year}年度 ${o.term}学期</span>
      <span>${o.instructor || '(担当未定)'}</span>
      <span>${o.schedule || ''}</span>
      ${o.syllabus_url ? `<a href="${o.syllabus_url}" target="_blank" rel="noopener">公式シラバスを見る ↗</a>` : ''}
    </div>`).join('');
  return `${descHtml}<div class="offering-list">${offeringsHtml}</div>`;
}
function buildDetailRow(c) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  tr.innerHTML = `<td colspan="6">${detailInner(c)}</td>`;
  return tr;
}

function renderEnrolled() {
  const area = document.getElementById('enrolledArea');
  if (enrollments.length === 0) {
    area.innerHTML = '<div class="empty-note">まだ何も追加されていません。上の科目一覧から「＋」を押してください。</div>';
    return;
  }
  let html = `<div class="erow head">
    <span>科目番号</span><span>タイトル</span><span>区分</span><span>状態(クリックで変更)</span><span>単位</span><span></span>
  </div>`;
  // 新しく追加したものが上に来るように、追加順の逆で表示する
  [...enrollments].reverse().forEach(e => {
    const statusCell = STATUS_MAIN.includes(e.status)
      ? `<div class="chips e-status-cell">${STATUS_MAIN.map(st => `<button class="chip${st === e.status ? ' on' : ''}" data-status="${st}">${st}</button>`).join('')}</div>`
      : `<select class="e-status e-status-cell">${STATUS_ALL.map(st => `<option ${st === e.status ? 'selected' : ''}>${st}</option>`).join('')}</select>`;
    html += `<div class="erow" data-id="${e.id}">
      <span class="cno">${e.course_no}</span>
      <span class="e-title"><button type="button" class="title-btn" data-ecno="${e.course_no}">${e.title_ja}</button></span>
      <select class="e-cat">
        ${ACTIVE_CATEGORIES.filter(c => !hiddenCat(c.id) || c.id === e.category_id).map(c => `<option value="${c.id}" ${c.id===e.category_id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      ${statusCell}
      <span class="e-credit">${displayCredit(e.credit)}</span>
      <button class="rm" title="履修リストから外す">✕</button>
    </div>${expandedEnr === e.course_no && courseByNo[e.course_no] ? `<div class="e-detail">${detailInner(courseByNo[e.course_no])}</div>` : ''}`;
  });
  area.innerHTML = html;
  area.querySelectorAll('.title-btn').forEach(b => b.addEventListener('click', () => {
    expandedEnr = (expandedEnr === b.dataset.ecno) ? null : b.dataset.ecno;
    renderEnrolled();
  }));

  area.querySelectorAll('.erow[data-id]').forEach(row => {
    const id = row.dataset.id;
    const setStatus = (value) => {
      const en = enrollments.find(x => x.id === id);
      if (!en) return;
      en.status = value;
      saveEnrollments(enrollments);
      renderEnrolled();
      renderLedger();
    };
    row.querySelector('.e-cat').addEventListener('change', ev => {
      const en = enrollments.find(x => x.id === id);
      en.category_id = ev.target.value;
      saveEnrollments(enrollments);
      renderLedger();
    });
    row.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => setStatus(btn.dataset.status));
    });
    const sel = row.querySelector('select.e-status');
    if (sel) sel.addEventListener('change', ev => setStatus(ev.target.value));
    row.querySelector('.rm').addEventListener('click', () => {
      enrollments = enrollments.filter(x => x.id !== id);
      saveEnrollments(enrollments);
      renderEnrolled();
      renderLedger();
      renderCourseTable();
    });
  });
}

// ---- トースト(追加した直後の取り消し) ----
let toastTimer = null;
function hideToast() {
  document.getElementById('toast').classList.remove('show');
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
}
function showToast(message, onUndo) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span></span><button type="button">取り消し</button>`;
  el.querySelector('span').textContent = message;
  el.querySelector('button').addEventListener('click', () => { onUndo(); hideToast(); });
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}

// 科目をすぐに履修リストへ追加する(区分は科目とメジャーから自動、状態は「追加時の状態」)
function addCourse(cno) {
  const course = COURSES.find(c => c.course_no === cno);
  if (!course) return;
  if (enrollments.some(e => e.course_no === cno)) return;
  const catName = courseCategory(course);
  const cat = catByName[catName] || catById['elective'] || ACTIVE_CATEGORIES[0];
  const id = 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  enrollments.push({
    id,
    course_no: course.course_no,
    title_ja: course.title_ja,
    credit: course.credit,
    category_id: cat.id,
    status: addStatus,
    term_label: ''
  });
  saveEnrollments(enrollments);
  renderEnrolled();
  renderLedger();
  renderCourseTable();
  showToast(`${course.course_no} を「${addStatus}」で追加しました`, () => {
    enrollments = enrollments.filter(x => x.id !== id);
    saveEnrollments(enrollments);
    renderEnrolled();
    renderLedger();
    renderCourseTable();
  });
}

document.getElementById('courseBody').addEventListener('click', ev => {
  const addBtn = ev.target.closest('.add-btn');
  if (addBtn) { addCourse(addBtn.dataset.cno); return; }
  const titleBtn = ev.target.closest('.title-btn');
  if (titleBtn) {
    const cno = titleBtn.dataset.cno;
    expandedCno = (expandedCno === cno) ? null : cno;
    renderCourseTable();
  }
});
document.getElementById('addStatusSeg').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-status]');
  if (!btn) return;
  addStatus = btn.dataset.status;
  saveAddStatus(addStatus);
  renderAddStatusSeg();
  renderCourseTable();   // 「＋ 履修済」などのボタン表示を更新
});

document.querySelector('table.courses thead').addEventListener('click', ev => {
  const th = ev.target.closest('th.sortable');
  if (!th) return;
  // 昇順 → 降順 → 並べ替えなし の順に切り替える
  if (sortKey !== th.dataset.sort) { sortKey = th.dataset.sort; sortDir = 1; }
  else if (sortDir === 1) { sortDir = -1; }
  else { sortKey = ''; sortDir = 1; }
  renderCourseTable();
});
document.getElementById('searchBox').addEventListener('input', renderCourseTable);
document.getElementById('catFilter').addEventListener('change', renderCourseTable);
document.getElementById('prefixFilter').addEventListener('change', renderCourseTable);

// ---- チュートリアル(初回案内) ----
const TUTORIAL_KEY = 'icu_planner_tutorial_done_v1';
function isTutorialDone() {
  try { return localStorage.getItem(TUTORIAL_KEY) === '1'; } catch (e) { return false; }
}
function markTutorialDone() {
  try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch (e) {}
}

const TUTORIAL_STEPS = [
  {
    selector: '.major-select',
    title: 'まずはあなたの情報を設定',
    body: 'まず「履修形態」(メジャーのみ/ダブルメジャー/メジャー・マイナー)を選び、続けてメジャー(・第二メジャーやマイナー)、語学トラック(ELA/JLP)を選んでください。選ぶとすぐに、右側の卒業要件の必要単位に反映されます。'
  },
  {
    selector: '.ledger',
    title: '卒業要件の充足状況',
    body: '卒業に必要な単位のうち、区分ごとに今どれだけ取得・計画できているか、あと何単位必要かをここで確認できます。'
  },
  {
    selector: '#capRules',
    title: '必要単位を超えた分',
    body: '必要単位を超えて履修した分は、この「総計」の下に表示されます。選択科目としてどれだけ算入できるかもここで確認できます。(この表示はまだ仮の形で、今後UIを変更する予定です)'
  },
  {
    selector: '#addStatusSeg',
    title: '科目をかんたんに追加',
    body: '上の「追加時の状態」(履修済・履修中など)を選んでおき、科目一覧の「＋」ボタンを押すだけで、その状態のまま履修リストに追加されます。'
  },
  {
    selector: '.controls',
    title: '科目をしぼりこむ',
    body: '検索窓・区分・メジャーの3つを組み合わせて、見たい科目だけに絞り込めます。'
  },
  {
    selector: '#sync-btn',
    title: '別の端末とデータを共有',
    body: 'この「同期」ボタンから、スマホとパソコンなど複数の端末でデータを共有できます。1台目で12文字以上のパスフレーズを決めて「始める」を押すと、同期コードが表示されます。2台目でそのコードとパスフレーズを入力すれば引き継げます。データは端末で暗号化されるため、運営側からは読めません。パスフレーズを忘れると復元できないので、コードと一緒に控えておいてください。'
  },
  {
    selector: '#fb',
    title: 'ご意見・ご要望',
    body: 'ご意見、ご要望があれば、ページ末尾の「意見フォームはこちら」からお伝えください。'
  }
];

let tutorialStep = 0;
let tutorialEls = null;

function buildTutorialOverlay() {
  const box = document.createElement('div');
  box.className = 'tutorial-highlight';
  const card = document.createElement('div');
  card.className = 'tutorial-card';
  tutorialEls = { box, card };
}

function positionTutorial() {
  const step = TUTORIAL_STEPS[tutorialStep];
  const { box, card } = tutorialEls;
  const target = document.querySelector(step.selector);
  // 画面の高さの半分以上ある背の高い要素(左側の充足状況など)は、スクロールせずに画面内の部分だけを囲む
  let r = target ? target.getBoundingClientRect() : { left: 20, top: 20, width: 0, height: 0, bottom: 20 };
  const tall = !!target && r.height > window.innerHeight * 0.55;
  if (target && target.scrollIntoView) {
    if (!tall) { try { target.scrollIntoView({ block: 'center' }); } catch (e) {} }
    else if (r.bottom < 80 || r.top > window.innerHeight - 80) { try { target.scrollIntoView({ block: 'start' }); } catch (e) {} }
    r = target.getBoundingClientRect();
  }
  if (tall) {
    const t = Math.max(r.top, 8), b = Math.min(r.bottom, window.innerHeight - 8);
    r = { left: r.left, top: t, width: r.width, height: Math.max(0, b - t), bottom: b };
  }
  const pad = 6;
  box.style.left = (r.left - pad) + 'px';
  box.style.top = (r.top - pad) + 'px';
  box.style.width = (r.width + pad * 2) + 'px';
  box.style.height = (r.height + pad * 2) + 'px';

  const cardWidth = Math.min(340, window.innerWidth - 32);
  card.style.width = cardWidth + 'px';
  const ch = card.offsetHeight || 190;   // 説明文の長さで変わるカードの実際の高さ
  let top = r.bottom + 14;
  if (top + ch > window.innerHeight - 8) top = Math.max(14, r.top - 18 - ch);   // 下に入らなければ対象の上に出す
  if (tall) top = Math.max(14, window.innerHeight - ch - 14);  // 背の高い要素のときは画面の下側に出す
  let left = Math.min(Math.max(14, r.left), Math.max(14, window.innerWidth - cardWidth - 14));
  card.style.top = top + 'px';
  card.style.left = left + 'px';
}

function renderTutorialStep() {
  const step = TUTORIAL_STEPS[tutorialStep];
  const { card } = tutorialEls;
  const isLast = tutorialStep === TUTORIAL_STEPS.length - 1;
  card.innerHTML = `
    <div class="tutorial-progress">ステップ ${tutorialStep + 1} / ${TUTORIAL_STEPS.length}</div>
    <h3>${step.title}</h3>
    <p>${step.body}</p>
    <div class="tutorial-actions">
      <button type="button" class="btn ghost" id="tutSkip">スキップ</button>
      <div style="flex:1"></div>
      ${tutorialStep > 0 ? '<button type="button" class="btn ghost" id="tutBack">戻る</button>' : ''}
      <button type="button" class="btn primary" id="tutNext">${isLast ? '完了' : '次へ'}</button>
    </div>`;
  card.querySelector('#tutSkip').addEventListener('click', endTutorial);
  card.querySelector('#tutNext').addEventListener('click', () => {
    if (isLast) { endTutorial(); }
    else { tutorialStep++; renderTutorialStep(); }
  });
  const backBtn = card.querySelector('#tutBack');
  if (backBtn) backBtn.addEventListener('click', () => { tutorialStep--; renderTutorialStep(); });
  positionTutorial();
}

function startTutorial() {
  tutorialStep = 0;
  if (!tutorialEls) buildTutorialOverlay();
  document.body.appendChild(tutorialEls.box);
  document.body.appendChild(tutorialEls.card);
  window.addEventListener('resize', positionTutorial);
  renderTutorialStep();
}

function endTutorial() {
  markTutorialDone();
  if (tutorialEls) {
    tutorialEls.box.remove();
    tutorialEls.card.remove();
  }
  window.removeEventListener('resize', positionTutorial);
}

document.getElementById('tutorialBtn').addEventListener('click', startTutorial);

renderAddStatusSeg();
renderModeSelect();
renderPrimaryLabel();
renderMajorSelect();
renderSecondarySelect();
renderSecondaryVisibility();
renderElaStreamSelect();
renderCategoryFilter();
renderPrefixFilter();
renderCourseTable();
renderEnrolled();
renderLedger();

if (!isTutorialDone()) {
  setTimeout(startTutorial, 300);
}
