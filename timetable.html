<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>時間割 — 履修台帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEAE0;--panel:#E4DDCE;--panel-2:#DAD2BE;--ink:#1E2A33;--muted:#5C6B73;--gold:#8C6A1E;--rust:#9C4530;--border:#C9BFA9;--serif:'Lora',Georgia,'Noto Serif JP',serif;--sans:'Inter','Hiragino Sans','Noto Sans JP',sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#10191F;--panel:#16222A;--panel-2:#1C2A33;--ink:#EDE6D6;--muted:#8A97A0;--gold:#C9A227;--rust:#C1614A;--border:#2A3944}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}
h1{font:600 26px var(--serif);margin:0}h2{font:600 15px var(--serif);color:var(--muted);margin:0 0 10px}
a{color:var(--gold)}button,select,input{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--gold)}button.on,.tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.nv{padding:4px 12px;border:1px solid var(--border);border-radius:3px;text-decoration:none;color:var(--ink);font-size:13px}.nv.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}tr.lun td.e{background:var(--panel)}.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}.tab{background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1fr 320px;gap:28px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;table-layout:fixed}th{font-weight:500;font-size:12px;color:var(--muted);padding:4px;border-bottom:1px solid var(--ink)}
td{border:1px solid var(--border);height:46px;padding:2px;font-size:11.5px;line-height:1.3;text-align:center;vertical-align:middle;overflow:hidden}
td.h{width:62px;font:11px var(--mono);color:var(--muted);background:var(--panel)}tr.sup td{height:32px;font-size:10.5px}
td.e{cursor:pointer}td.e:hover{background:var(--panel)}td.x{background:var(--panel-2);color:var(--muted)}td.blk{background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 4px,var(--panel-2) 4px,var(--panel-2) 8px);color:var(--muted)}
td.ela{background:#4A2F1E;color:#F3E9DC}td.dup{background:var(--rust);color:#fff;font-weight:500}td.c{cursor:pointer}td.c.p{opacity:.5;outline:2px dashed var(--ink);outline-offset:-3px}td.c.s{opacity:.78}
.box{padding:10px 12px;background:var(--panel);border:1px solid var(--border);margin-bottom:14px;font-size:12.5px}.warn{color:var(--rust);font-weight:500}.mu{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}.row:first-of-type{border-top:0}
</style>
</head>
<body>
<div class="wrap">
<header><div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><h1>履修台帳</h1><a href="index.html" class="nv">卒業要件</a><a class="nv on">時間割</a></div></header>
<div class="tabs" id="tabs"></div>
<div class="bar" id="bar"></div>
<div class="layout">
<div><table id="grid"></table><p class="mu" id="note"></p><div id="leg" class="mu" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px"></div></div>
<div><div class="box" id="cred"></div><div class="box" id="side"></div><div class="box" id="list"></div></div>
</div>
</div>
<script src="data.js"></script>
<script>
const TTK='icu_planner_timetables_v1',ENK='icu_planner_enrollments_v1',CURK='icu_planner_tt_cur_v1';
const DAYS=['M','TU','W','TH','F','SA'],DL=['月','火','水','木','金','土'],SUPD=['M','W','TH','F'];
const ELAN=['ARW','RCA','AS','Tutorial','S&L','ATS','R&E','リサーチライティング'];
const ROWS=['1','2','3','L','4','5','6','7'];
const PT={'1':['8:45','10:00'],'2':['10:10','11:25'],'3':['11:35','12:50'],L:['12:50','14:00'],'4':['14:00','15:15'],'5':['15:25','16:40'],'6':['16:50','18:05'],'7':['18:15','19:30']};
const PC={'1':['8:45','9:50'],'2':['10:00','11:05'],'3':['11:15','12:20'],L:['12:20','14:40'],'4':['14:40','15:45'],'5':['15:55','17:00'],'6':['17:10','18:15'],'7':['18:25','19:30']};
// 時限の開始・終了(分)。スーパー時限は公式の時限表に基づく
const TM={'1':[525,600],'2':[610,685],'3':[695,770],'4':[840,915],'*4':[800,915],'5':[925,1000],'*5':[925,1040],'6':[1010,1085],'7':[1095,1170],'*7':[1095,1210]};
const ST=['履修済','履修中','予定','検討中'],$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const CM=Object.fromEntries(COURSES.map(c=>[c.course_no,c]));
const mk=n=>({id:'t'+Date.now()+n,name:'時間割'+n,year:new Date().getFullYear(),grade:1,term:'春',ela:[],em:{},pl:[]});
let tts=ld(TTK,[]),cur=+ld(CURK,0)||0,enr=ld(ENK,[]),mode='',menu=null,look=null;
if(!tts.length)tts.push(mk(1));
const tt=()=>tts[Math.min(cur,tts.length-1)];
let Q='';
const COL=ld('icu_tt_colors_v1',{}),PFX=[...new Set(COURSES.map(c=>c.prefix))].sort();
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12,c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
const colr=p=>COL[p]||hsl2hex((PFX.indexOf(p)*137.508)%360,45,38);
const tc=h=>{const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16));return(v[0]*299+v[1]*587+v[2]*114)/1000>150?'#1E2A33':'#fff'};
const sp=s=>{const m=/^(\*?\d)\/([A-Z]+)$/.exec(String(s).replace(/[()>]/g,'').trim());return m&&{p:m[1],d:m[2]}};
const ov=(a,b)=>a.d===b.d&&TM[a.p][0]<TM[b.p][1]&&TM[b.p][0]<TM[a.p][1];
const slotsOf=o=>(o.schedule||'').split(',').map(sp).filter(Boolean);
const off=(c,t)=>c.offerings.find(o=>o.term===t.term&&+o.year===t.year)||c.offerings.find(o=>o.term===t.term);
const cr=r=>{const s=String(r);let m=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*\(/);if(m)return+m[1];m=s.match(/\((\d+(?:\.\d+)?)\)/);if(m)return+m[1];m=s.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return m[1]/m[2];return parseFloat(s.replace(/[^\d.]/g,''))||0};
const fmt=n=>{const a=Math.round(n*3);if(Math.abs(n*3-a)>1e-6)return String(Math.round(n*100)/100);const w=Math.floor(a/3),r=a%3;return r?(w?w+'+'+r+'/3':r+'/3'):String(w)};
function save(){sv(TTK,tts);sv(CURK,cur);sv(ENK,enr)}
function occ(t){const a=[];t.ela.forEach(k=>a.push({c:'ELA',s:[sp(k)]}));t.pl.forEach(p=>{const c=CM[p.cno],o=c&&off(c,t);if(o)a.push({c:p.cno,s:slotsOf(o)})});return a}
const conf=(t,s,skip)=>occ(t).filter(x=>x.c!==skip&&x.s.some(a=>s.some(b=>ov(a,b))));
function catId(c){const f={'英語(ELA)':'ela','日本語(JLP)':'jlp','一般教育':'ge','保健体育':'hpe'}[c.fixed_category];if(f)return f;if(c.level==null)return'elective';const m=localStorage.getItem('icu_planner_major_v1')||'ISC';return c.level===1?'foundation':(c.prefix===m?'major':'elective')}
function setSt(cno,st){const e=enr.find(x=>x.course_no===cno);if(e)e.status=st;else{const c=CM[cno];enr.push({id:'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),course_no:cno,title_ja:c.title_ja,credit:c.credit,category_id:catId(c),status:st,term_label:''})}}
// 科目を置く。衝突したら、どちらを残すか尋ねる
function place(t,c,st){const o=off(c,t);if(!o)return false;const s=slotsOf(o);
  if(!s.length){alert('この科目は時限が未定のため、時間割に置けません。');return false}
  const cf=conf(t,s,c.course_no);
  if(cf.some(x=>x.c==='ELA'))return false;
  for(const x of cf){const oc=CM[x.c];
    if(confirm(`「${c.title_ja}」は「${oc.title_ja}」と時限が重なります。\nOK: 「${c.title_ja}」を置く(「${oc.title_ja}」は検討中に戻す)\nキャンセル: 次へ`)){t.pl=t.pl.filter(p=>p.cno!==x.c);setSt(x.c,'検討中')}
    else if(!confirm(`重複したまま両方置きますか?(重複コマはハイライトされます)\nキャンセル: 「${c.title_ja}」を置かない`))return false}
  t.pl=t.pl.filter(p=>p.cno!==c.course_no);t.pl.push({cno:c.course_no,st});
  if(st!=='tent')setSt(c.course_no,st);return true}
// 検討中・予定の科目を仮配置する(開講学期が少ない科目・予定を優先)
function recommend(){const t=tt(),placed=new Set(t.pl.map(p=>p.cno));let n=0,skip=0;
  const cs=enr.filter(e=>(e.status==='予定'||e.status==='検討中')&&!placed.has(e.course_no)&&CM[e.course_no]&&CM[e.course_no].offerings.some(o=>o.term===t.term))
   .sort((a,b)=>CM[a.course_no].offerings.length-CM[b.course_no].offerings.length||(a.status==='予定'?0:1)-(b.status==='予定'?0:1));
  cs.forEach(e=>{place(t,CM[e.course_no],'tent')?n++:skip++});
  save();render();alert(`${n}件を仮配置しました。${skip?skip+'件は時限の未定・衝突などで置けませんでした。':''}`)}
// 学期ごとの単位上限(ELA以外の科目。1年次のELA履修者は学期・ストリームで異なる)
function limit(t,a){if(!a&&t.cap>0)return t.cap+(t.cap3?1/3:0);const m=/^stream(\d)$/.exec(localStorage.getItem('icu_planner_ela_stream_v1')||'');
  if((t.grade||1)===1&&m){const n=+m[1],v={1:{'春':31/3},2:{'春':31/3,'秋':31/3},3:{'春':22/3,'秋':22/3,'冬':22/3},4:{'春':19/3,'秋':19/3,'冬':19/3}}[n][t.term];if(v)return v}return 17}
const search=q=>{const t=tt(),u=q.trim().toUpperCase();return u?COURSES.filter(c=>c.prefix!=='ELA'&&(c.course_no.toUpperCase().includes(u)||c.title_ja.includes(q.trim()))&&off(c,t)).slice(0,30):[]};
function resRows(l){const t=tt();return l.map(c=>{const e=enr.find(e=>e.course_no===c.course_no),on=t.pl.some(p=>p.cno===c.course_no);return`<div class="row"><span>${esc(c.title_ja)}<br><span class="mu">${c.course_no} / ${fmt(cr(c.credit))}単位${e?' / '+e.status:''}</span></span><span><button data-sst="予定" data-c2="${c.course_no}">予定</button> <button data-sst="検討中" data-c2="${c.course_no}">検討中</button> ${on?'<span class="mu">配置済</span>':`<button data-add="${c.course_no}">時間割へ追加</button>`}</span></div>`}).join('')||'<span class="mu">該当する科目がありません。</span>'}
function listHtml(t){const l=enr.filter(e=>(e.status==='予定'||e.status==='検討中')&&CM[e.course_no]&&off(CM[e.course_no],t));
  return'<h2>この学期に開講される予定・検討中の授業</h2><button id="rec">一括仮配置</button>'+(l.map(e=>{const c=CM[e.course_no],on=t.pl.some(p=>p.cno===e.course_no);return`<div class="row"><span>${esc(c.title_ja)}<br><span class="mu">${e.status} / ${fmt(cr(c.credit))}単位</span></span>${on?'<span class="mu">配置済</span>':`<button data-add="${e.course_no}">時間割へ追加</button>`}</div>`}).join('')||'<div class="mu" style="margin-top:8px">該当する授業はありません。</div>')}
function render(){const t=tt();t.em=t.em||{};const cy=new Date().getFullYear(),PX=t.term==='春'&&t.cw?PC:PT,dys=t.nosat?DAYS.slice(0,5):DAYS,gr=t.grade||1;
  $('tabs').innerHTML=tts.map((x,i)=>`<button class="tab${i===cur?' on':''}" data-t="${i}">${esc(x.name)}</button>`).join('')+'<button id="add" title="時間割を追加">＋</button>';
  $('bar').innerHTML=`<input id="nm" value="${esc(t.name)}" style="width:130px"><select id="yr">${Array.from({length:13},(_,i)=>cy-6+i).map(y=>`<option${y===t.year?' selected':''}>${y}</option>`).join('')}</select>年度<select id="gr">${[1,2,3,4].map(g=>`<option${g===gr?' selected':''}>${g}</option>`).join('')}</select>年次<select id="tm">${['春','秋','冬'].map(x=>`<option${x===t.term?' selected':''}>${x}</option>`).join('')}</select>学期
   <button id="ela" class="${mode==='ela'?'on':''}">ELA枠を入力</button>${t.term==='春'?`<button id="cw" class="${t.cw?'on':''}">C-week時間</button>`:''}<button id="sat">${t.nosat?'土曜を表示':'土曜を非表示'}</button><button id="del" title="この時間割を削除">🗑</button>`;
  const o=occ(t);let h='<tr><th></th>'+dys.map(d=>`<th>${DL[DAYS.indexOf(d)]}</th>`).join('')+'</tr>';
  ROWS.forEach(r=>{const tx=`${r==='L'?'昼休み':r+'限'}<br>${PX[r][0]}-${PX[r][1]}`;
    if(r==='L'){h+=`<tr class="lun"><td class="h">${tx}</td><td class="x" colspan="${dys.length}" style="height:24px"></td></tr>`;return}
    h+=`<tr><td class="h">${tx}</td>`;
    dys.forEach(d=>{const k=r+'/'+d,me=o.filter(x=>x.s.some(a=>a.p.replace('*','')===r&&a.d===d));
      if(me.length>1){h+='<td class="dup">'+me.map(x=>`<span data-c="${x.c}" style="display:block;cursor:pointer">${esc(CM[x.c].title_ja.slice(0,10))}</span>`).join('')+'</td>';return}
      if(me.length){const x=me[0];if(x.c==='ELA'){const m=t.em[k];h+=`<td class="ela e" data-k="${k}">ELA${m?'<br>'+esc(CM[m]?CM[m].title_ja.split('：').pop().slice(0,10):m):''}</td>`}else{const p=t.pl.find(p=>p.cno===x.c),sup=x.s.some(a=>a.p[0]==='*'&&a.p.slice(1)===r&&a.d===d);h+=`<td class="c ${p.st==='tent'?'p':p.st==='履修済'?'':'s'}" data-c="${x.c}" style="background:${colr(CM[x.c].prefix)};color:${tc(colr(CM[x.c].prefix))}" title="${esc(CM[x.c].title_ja)}">${sup?'[S]':''}${esc(CM[x.c].title_ja.slice(0,14))}</td>`}return}
      h+=o.some(x=>x.s.some(a=>ov(a,{p:r,d})))?'<td class="blk">重複</td>':`<td class="e" data-k="${k}"></td>`});h+='</tr>'});
  $('grid').innerHTML=h;
  $('leg').innerHTML=[...new Set(t.pl.map(p=>CM[p.cno]&&CM[p.cno].prefix).filter(Boolean))].sort().map(x=>`<label>${x} <input type="color" data-pc="${x}" value="${colr(x)}"></label>`).join('');
  $('note').textContent=(t.year!==2026?'※2026年度以外は開講データがないため、2026年度の開講を参考に表示しています。':'')+'色=メジャーごと(下の欄で変更できます)、薄く破線=仮配置(クリックで状態を選択)、やや薄い=履修中・予定・検討中、赤=時限が重複、斜線=スーパー時限と時間が重なるコマ、[S]=スーパー時限。';
  const used=t.pl.filter(p=>CM[p.cno]&&CM[p.cno].prefix!=='ELA').reduce((s,p)=>s+cr(CM[p.cno].credit),0),lim=limit(t);
  $('cred').innerHTML=`<h2>この学期の単位数(ELA科目を除く)</h2><b style="font:500 18px var(--mono)">${fmt(used)}</b> / 上限 ${fmt(lim)} 単位<div class="mu" style="margin:6px 0">上限を自分で設定: <input id="cap" type="number" min="0" step="1" value="${t.cap||''}" placeholder="自動 ${fmt(limit(t,1))}" style="width:90px"> <label><input type="checkbox" id="c3"${t.cap3?' checked':''}> +1/3</label></div><div class="mu">標準は13単位(体育実技を履修する場合は+1/3)。空欄なら、選んだ年次の公式の上限(1年次のELA履修者はストリームで異なる)を使います。</div>${used>lim+1e-9?`<div class="warn">上限を ${fmt(used-lim)} 単位超えています。</div>`:''}`;
  if(menu&&menu[0]==='#'){const k=menu.slice(1),es=ELAN;
    $('side').innerHTML=`<h2>このELA枠(${k})の授業</h2>`+es.map(c=>`<div class="row"><span>${esc(c)}</span><button data-em="${esc(c)}">選ぶ</button></div>`).join('')+'<div class="row"><span class="mu">未設定に戻す</span><button data-em="">解除</button></div>'}
  else if(menu){const p=t.pl.find(p=>p.cno===menu),c=CM[menu];$('side').innerHTML=p?`<h2>${esc(c.title_ja)}</h2><div class="mu">${c.course_no} / ${p.st==='tent'?'仮配置':'現在: '+p.st}</div><div class="bar" style="margin:8px 0 0">${ST.map(s=>`<button data-s="${s}">${s}</button>`).join('')}<button data-s="rm">時間割から外す</button></div>`:''}
  else if(look)lookup(look);
  else{$('side').innerHTML='<h2>授業を探す</h2><input id="q" placeholder="科目名・科目番号(この学期の開講)" style="width:100%" value="'+esc(Q)+'"><div id="qr">'+(Q?resRows(search(Q)):'')+'</div><div class="mu" style="margin-top:6px">空いている時限をクリックして、その時限の授業を探すこともできます。</div>'}
  $('list').innerHTML=listHtml(t);save()}
function lookup(k){const t=tt(),s=sp(k),pl=new Set(t.pl.map(p=>p.cno));
  const rs=COURSES.filter(c=>{if(pl.has(c.course_no)||c.prefix==='ELA')return false;const e=enr.find(e=>e.course_no===c.course_no);if(e&&e.status==='履修済')return false;const o=off(c,t);if(!o)return false;const ss=slotsOf(o);return ss.some(a=>a.p===s.p&&a.d===s.d)&&!conf(t,ss,c.course_no).length}).slice(0,40);
  $('side').innerHTML=`<h2>${DL[DAYS.indexOf(s.d)]}曜 ${s.p[0]==='*'?'スーパー'+s.p[1]:s.p+'限'} に開講</h2>`+resRows(rs)}
document.addEventListener('click',ev=>{const t=tt(),g=q=>ev.target.closest(q);let b;t.em=t.em||{};
  if(b=g('[data-t]')){cur=+b.dataset.t;menu=look=null}
  else if(g('#add')){tts.push(mk(tts.length+1));cur=tts.length-1;menu=look=null}
  else if(g('#ela'))mode=mode==='ela'?'':'ela';
  else if(g('#cw'))t.cw=!t.cw;
  else if(g('#sat')){if(!t.nosat&&occ(t).some(x=>x.s.some(a=>a.d==='SA'))){alert('土曜に配置済みの科目があるため、非表示にできません。');return}t.nosat=!t.nosat}
  else if(g('#rec')){recommend();return}
  else if(g('#del')){if(tts.length<2||!confirm('この時間割を削除しますか?'))return;tts.splice(cur,1);cur=0;menu=look=null}
  else if(b=g('[data-add]')){const e=enr.find(e=>e.course_no===b.dataset.add);if(place(t,CM[b.dataset.add],e?e.status:'予定'))look=null}
  else if(b=g('[data-sst]'))setSt(b.dataset.c2,b.dataset.sst);
  else if(b=g('[data-em]')){const k=menu.slice(1);if(b.dataset.em)t.em[k]=b.dataset.em;else delete t.em[k];menu=null}
  else if(b=g('[data-s]')){const p=t.pl.find(p=>p.cno===menu);if(b.dataset.s==='rm')t.pl=t.pl.filter(x=>x.cno!==menu);else{p.st=b.dataset.s;setSt(menu,p.st)}menu=null}
  else if(b=g('[data-c]')){menu=b.dataset.c;look=null}
  else if(b=g('td[data-k]')){const k=b.dataset.k;if(mode==='ela'){const i=t.ela.indexOf(k);if(i>=0)t.ela.splice(i,1);else if(!conf(t,[sp(k)]).length)t.ela.push(k)}else if(b.classList.contains('ela')){menu='#'+k;look=null}else{look=k;menu=null}}
  else return;render()});
document.addEventListener('change',ev=>{const t=tt(),i=ev.target.id;
  if(ev.target.dataset.pc){COL[ev.target.dataset.pc]=ev.target.value;sv('icu_tt_colors_v1',COL);render();return}
  if(i==='nm')t.name=ev.target.value||t.name;if(i==='yr')t.year=+ev.target.value;if(i==='gr')t.grade=+ev.target.value;if(i==='tm')t.term=ev.target.value;
  if(i==='cap')t.cap=Math.max(0,parseInt(ev.target.value)||0);if(i==='c3')t.cap3=ev.target.checked;
  menu=look=null;render()});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){Q=ev.target.value;$('qr').innerHTML=Q?resRows(search(Q)):''}});
render();
</script>
</body>
</html>
